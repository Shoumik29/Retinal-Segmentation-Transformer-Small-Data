data:
  root: "data/HRF"
  train:
    images: "training/images"
    masks: "training/masks"
    fov: "training/FOV"
  test:
    images: "test/images"
    masks: "test/masks"
    fov: "test/FOV"
  colormap: "colormap.mat"
  colormap_key: "color_map"
  processed_dir: "data/processed"
  num_classes: 2
  batch_size: 1

preprocessing:
  patch_size: 224
  step: [224, 224]
  scale: 255.0

evaluation:
  channels: 3
  figure:
    figsize: [20, 20]
    font_size: 16
    grid: [4, 3]
    titles: ["RGB", "OriginalMask", "Prediction"]
  separator_width: 10
  output_dir: "results"
